<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestros Momentos 💞</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="style.css">
    <!-- sql.js WASM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

    <!-- Header Flotante / Pequeño -->
    <header style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 20px; text-align: center; backdrop-filter: blur(4px);">
        <h1 style="font-size: 1.2rem; margin: 0;">💞 Nuestros Momentos</h1>
    </header>

    <div class="container">
        <!-- Barra de Filtros Flotante (Se llena con JS) -->
        <div id="filters-bar" class="filters-bar">
            <!-- Chips se inyectan aquí -->
        </div>

        <!-- Mapa Completo -->
        <div id="map"></div>
    </div>

    <!-- Modal: Todos los Filtros -->
    <div id="all-filters-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 400px;">
            <button class="modal-close" id="close-all-filters">&times;</button>
            <h3 style="text-align: center; color: var(--primary-color);">Filtrar Momentos</h3>
            <div id="all-filters-grid" class="filters-grid">
                <!-- Todos los chips aquí -->
            </div>
            <button id="apply-filters" class="btn-primary" style="margin-top: 15px;">Ver Resultados</button>
        </div>
    </div>

    <!-- Modal Crear Recuerdo -->
    <div id="creation-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" id="creation-close">&times;</button>
            <h2 style="color: var(--primary-color); margin-top: 15px; text-align: center;">Nuevo Recuerdo</h2>
            
            <form id="memory-form">
                <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea id="description" rows="3" placeholder="¿Que pasó aquí?" required></textarea>
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <div class="date-wrapper">
                        <span class="date-icon">📅</span>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Categoría</label>
                    <select id="category">
                        <option value="Beso">💋 Beso</option>
                        <option value="Cita">🍽️ Cita</option>
                        <option value="Viaje">✈️ Viaje</option>
                        <option value="Hogar">🏠 Hogar</option>
                        <option value="Especial">❤️ Especial</option>
                        <option value="Celebración">🎉 Celebración</option>
                        <option value="Primera vez">🌅 Primera vez</option>
                        <option value="Música">🎵 Música</option>
                        <option value="Día raro">🌧️ Día raro</option>
                        <option value="Favorito">⭐ Favorito</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fotografía</label>
                    <div class="file-dropzone" id="dropzone">
                        <div class="dropzone-content">
                            <button type="button" class="btn-secondary" style="margin-bottom: 5px;">📷 Seleccionar Foto</button>
                            <p style="margin: 0; font-size: 0.8em; opacity: 0.7;">(O arrastra aquí)</p>
                        </div>
                        <input type="file" id="photo" accept="image/*">
                        <img id="preview" src="" alt="Vista previa">
                    </div>
                </div>

                <div class="modal-actions" style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="button" class="btn-secondary" id="btn-cancel" style="background: #ccc; flex: 1; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="flex: 1; margin-top: 0;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ver Recuerdo -->
    <div id="moment-modal" class="modal-overlay hidden">
        <div class="modal-content moment-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-body">
                <div class="moment-header">
                    <div id="driver-icon" class="category-icon">❤️</div>
                    <div>
                        <h2 id="modal-category" style="margin:0;">Categoría</h2>
                        <div class="modal-date" id="modal-date" style="font-size: 0.9em; opacity: 0.7;">Fecha</div>
                    </div>
                </div>
                
                <div id="modal-image-container">
                    <img id="modal-image" src="" alt="Recuerdo">
                </div>
                
                <div class="moment-desc-box">
                    <p id="modal-description">Descripción del momento...</p>
                </div>

                <button id="btn-delete" class="btn-danger">🗑️ Eliminar Recuerdo</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox-overlay hidden">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-image" src="" alt="Pantalla Completa">
    </div>

    <!-- Leaflet JS & MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Scripts -->
    <script src="database.js"></script>
    <script src="map.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>

</body>
</html>
